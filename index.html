<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="InkloomGuard AI — AI-Powered Brand Compliance & Governance Platform for brand tone, terminology, approved facts, accessibility, and human review."
    />
    <meta property="og:title" content="InkloomGuard AI — Brand Compliance Platform" />
    <meta
      property="og:description"
      content="Enterprise brand compliance auditing powered by deterministic rule engines and Gemini AI."

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('inkloom_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-indigo-500/20 selection:text-indigo-700 dark:selection:text-violet-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
